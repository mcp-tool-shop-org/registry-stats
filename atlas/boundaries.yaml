summary: ""
boundaries:
  - name: .claude
    globs:
      - .claude/**
    role: data
  - name: .github
    globs:
      - .github/**
    role: config
  - name: assets
    globs:
      - assets/**
    role: data
  - name: desktop
    globs:
      - desktop/**
    role: code
  - name: root
    globs:
      - "*"
    role: config
  - name: site
    globs:
      - site/**
    role: site
  - name: src
    globs:
      - src/**
    role: code
  - name: test
    globs:
      - test/**
    role: test
