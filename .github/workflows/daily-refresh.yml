name: Daily Refresh

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # ── Data Pipeline ─────────────────────────────────────────
      # No continue-on-error: a hard fetch failure must fail the run so stale
      # data is never masked by a green check. The data files are untouched by a
      # crash, so a failed run commits nothing.
      - name: Fetch live stats
        id: fetch
        working-directory: site
        run: npm run fetch-stats

      # Guard: catch a soft failure (script exited 0 but wrote stale data) by
      # checking stats.json freshness. Fails the job if fetchedAt is older than 26h.
      - name: Verify stats freshness
        run: |
          node -e '
            const fs = require("fs");
            const p = "site/src/data/stats.json";
            if (!fs.existsSync(p)) { console.error("::error::stats.json missing"); process.exit(1); }
            const doc = JSON.parse(fs.readFileSync(p, "utf8"));
            const fetchedAt = new Date(doc.fetchedAt);
            const ageH = (Date.now() - fetchedAt.getTime()) / 3.6e6;
            console.log(`stats.json fetchedAt=${fetchedAt.toISOString()} age=${ageH.toFixed(1)}h dataQuality=${doc.dataQuality || "ok"}`);
            if (!(ageH < 26)) { console.error(`::error::stats.json is stale (${ageH.toFixed(1)}h old)`); process.exit(1); }
            if (doc.dataQuality === "unusable") { console.error("::error::stats.json dataQuality is unusable"); process.exit(1); }
            if (doc.dataQuality === "degraded") console.log("::warning::stats.json dataQuality is degraded");
          '

      # Surface any failure (fetch crash or stale data) as a single tracked issue
      # so a silently-failing daily run is visible without spamming new issues.
      - name: Open/update tracking issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Daily refresh failing';
            const body = `The Daily Refresh workflow failed on ${new Date().toISOString()}.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Likely cause: live stats fetch failed or wrote stale data. Investigate the registry APIs and re-run.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'daily-refresh',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['daily-refresh'],
              });
            }

      # ── Quality Gate ──────────────────────────────────────────
      - name: Run tests
        run: npm test

      - name: Upload fresh data for the commit-back job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-stats
          path: |
            site/src/data/stats.json
            site/src/data/snapshots.json
            site/src/data/history.json
            site/public/data/stats.json
            site/public/data/packages.json
          if-no-files-found: error
          retention-days: 1

  # contents: write is only on this job, so npm and fetch-stats never see a token
  # that can push. Branch protection rejecting a [skip ci] commit is expected and
  # must not fail the run. Any other pull or push failure does.
  persist:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fresh-stats
          path: fresh-stats

      - name: Commit fresh stats back to repo
        run: |
          # upload-artifact roots a multi-path upload at the least common
          # ancestor, which is site/. The zip contains src/ and public/.
          cp fresh-stats/src/data/stats.json site/src/data/stats.json
          cp fresh-stats/src/data/snapshots.json site/src/data/snapshots.json
          cp fresh-stats/src/data/history.json site/src/data/history.json
          cp fresh-stats/public/data/stats.json site/public/data/stats.json
          cp fresh-stats/public/data/packages.json site/public/data/packages.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/stats.json site/src/data/snapshots.json site/src/data/history.json site/public/data/stats.json site/public/data/packages.json
          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi
          git commit -m "chore: daily stats refresh [skip ci]"
          if ! git pull --rebase --autostash origin main; then
            echo "::error::rebase onto origin/main failed"
            exit 1
          fi
          set +e
          push_out=$(git push 2>&1)
          push_status=$?
          set -e
          echo "$push_out"
          if [ "$push_status" -ne 0 ]; then
            if echo "$push_out" | grep -Eqi 'protected branch|required status check|GH006|must be made through a pull request'; then
              echo "::notice::daily stats commit-back push rejected by branch protection; data fetched and verified"
              exit 0
            fi
            echo "::error::daily stats push failed"
            exit 1
          fi
