name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'atlas/**'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'atlas/**'
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC (staggered after daily-refresh 06:00)
  workflow_dispatch:

# Schedule, push, and workflow_dispatch each get their own group, so a push
# cannot cancel the Monday refresh. Duplicate pushes still cancel each other.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Audit site dependencies
        working-directory: site
        run: node scripts/audit.mjs

      - name: Build site
        working-directory: site
        run: npm run build

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # The site tree (Astro/Starlight/vite/esbuild) carries its own transitive CVE
      # surface, separate from the root engine. Gate it here so it can't silently
      # re-accumulate advisories (esbuild pinned via overrides to ^0.28.1).
      - name: Audit site dependencies
        working-directory: site
        run: node scripts/audit.mjs

      # On pull_request we only verify (audit + build) — skip the live fetch, the
      # stats commit/push, the Pages artifact upload, and the deploy job. Those run
      # only on push to main / schedule / manual dispatch.
      - name: Fetch live stats
        if: github.event_name != 'pull_request'
        working-directory: site
        # This job's token is read-only (contents: read). With it, GitHub release
        # requests use the 800ms authenticated lane instead of the 60s one.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-stats

      # fetch-stats exits 0 on degraded so daily-refresh can warn. Pages must not
      # publish that snapshot. Failing here skips both artifact uploads.
      - name: Refuse a zero-week snapshot
        if: github.event_name != 'pull_request'
        working-directory: site
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const q = JSON.parse(readFileSync('src/data/stats.json','utf8')).dataQuality; if (q === 'degraded' || q === 'unusable') { console.error('stats.json dataQuality is ' + q); process.exit(1); }"

      - name: Upload fresh data for the commit-back job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-stats
          path: |
            site/src/data/stats.json
            site/src/data/snapshots.json
            site/src/data/history.json
            site/public/data/stats.json
            site/public/data/packages.json
          if-no-files-found: error
          retention-days: 1

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  # contents: write lives only here, so npm ci and fetch-stats never see a token
  # that can push. A rejected [skip ci] push does not fail the deploy, which
  # already baked the fresh stats into the Pages artifact.
  persist:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fresh-stats
          path: fresh-stats

      - name: Commit fresh stats back to repo
        run: |
          # upload-artifact roots a multi-path upload at the least common
          # ancestor, which is site/. The zip contains src/ and public/.
          cp fresh-stats/src/data/stats.json site/src/data/stats.json
          cp fresh-stats/src/data/snapshots.json site/src/data/snapshots.json
          cp fresh-stats/src/data/history.json site/src/data/history.json
          cp fresh-stats/public/data/stats.json site/public/data/stats.json
          cp fresh-stats/public/data/packages.json site/public/data/packages.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/stats.json site/src/data/snapshots.json site/src/data/history.json site/public/data/stats.json site/public/data/packages.json
          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi
          git commit -m "chore: update stats snapshot [skip ci]"
          if ! git pull --rebase --autostash origin main; then
            echo "::error::rebase onto origin/main failed"
            exit 1
          fi
          set +e
          push_out=$(git push 2>&1)
          push_status=$?
          set -e
          echo "$push_out"
          if [ "$push_status" -ne 0 ]; then
            if echo "$push_out" | grep -Eqi 'protected branch|required status check|GH006|must be made through a pull request'; then
              echo "::notice::stats commit-back push rejected by branch protection; deploying fresh data anyway"
              exit 0
            fi
            echo "::error::stats commit-back push failed"
            exit 1
          fi

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
